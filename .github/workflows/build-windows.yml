name: Build HCW Animator Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build HCW Animator EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --name HCW_Animator hcw_animator.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: HCW_Animator_Windows
          path: dist/HCW_Animator.exe
