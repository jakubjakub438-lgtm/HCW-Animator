<script>

/*
============================================================
SHOT DESIGNER HCW -> WEB
============================================================

ZDROJ LOGIKY:

ShotDesigner_HCW_to_Blender_v2_0_UNIVERSAL.py

PRAVIDLO:

TECHNICKÝ PREPIS - BEZ INTERPRETÁCIE.

Žiadne scene-specific súradnice.
Žiadne ručné mená hercov.
Žiadne domýšľanie spojení.

============================================================
*/


/*
============================================================
XML HELPERS
Python:

T(e, tag)
F(e, tag)
============================================================
*/


function directChild(element, tagName) {

    if (!element) {
        return null;
    }

    for (let i = 0; i < element.childNodes.length; i++) {

        const node = element.childNodes[i];

        if (
            node.nodeType === 1 &&
            node.nodeName === tagName
        ) {
            return node;
        }
    }

    return null;
}


function directChildren(element, tagName) {

    const result = [];

    if (!element) {
        return result;
    }

    for (let i = 0; i < element.childNodes.length; i++) {

        const node = element.childNodes[i];

        if (
            node.nodeType === 1 &&
            node.nodeName === tagName
        ) {
            result.push(node);
        }
    }

    return result;
}


function T(element, tagName, defaultValue = "") {

    const node = directChild(element, tagName);

    if (!node) {
        return defaultValue;
    }

    if (node.textContent === null) {
        return defaultValue;
    }

    return node.textContent.trim();
}


function F(element, tagName, defaultValue = 0.0) {

    const value = Number(
        T(element, tagName, String(defaultValue))
    );

    return Number.isFinite(value)
        ? value
        : Number(defaultValue);
}


/*
============================================================
OBJECT EVENTS
Python equivalent:

def object_events(e):
    q = e.find("ObjectEvents")
    if q is None:
        return []

    for z in q.findall("OnOffEvent"):
        seq = int(T(z,"sequence","0"))
        active = T(z,"active","false").lower()=="true"
============================================================
*/


function objectEvents(element) {

    const q = directChild(
        element,
        "ObjectEvents"
    );

    if (!q) {
        return [];
    }

    const out = [];

    const events = directChildren(
        q,
        "OnOffEvent"
    );

    for (const z of events) {

        let sequence =
            parseInt(
                T(z, "sequence", "0"),
                10
            );

        if (!Number.isFinite(sequence)) {
            sequence = 0;
        }

        const active =
            T(
                z,
                "active",
                "false"
            ).toLowerCase() === "true";

        out.push({
            sequence,
            active
        });
    }

    return out;
}


/*
============================================================
FIRST TRUE SEQUENCE
============================================================
*/


function firstTrueSeq(element, defaultValue = 0) {

    const vals =
        objectEvents(element)
        .filter(event => event.active)
        .map(event => event.sequence);

    if (vals.length === 0) {
        return defaultValue;
    }

    return Math.min(...vals);
}


/*
============================================================
ANGLE
Python:

e.find("SubObjects/" + subtag + "/angle")
============================================================
*/


function angleOf(element, subtag) {

    const subObjects =
        directChild(
            element,
            "SubObjects"
        );

    if (!subObjects) {
        return 0.0;
    }

    const rotator =
        directChild(
            subObjects,
            subtag
        );

    if (!rotator) {
        return 0.0;
    }

    const angle =
        Number(
            T(
                rotator,
                "angle",
                "0"
            )
        );

    return Number.isFinite(angle)
        ? angle
        : 0.0;
}


/*
============================================================
CHARACTER SIGNATURE
Python:

(colorName, colorIndex, female)
============================================================
*/


function charSignature(element) {

    return [
        T(element, "colorName"),
        T(element, "colorIndex"),
        T(element, "female")
    ].join("|");
}


/*
============================================================
CLEAN CAPTION TEXT
============================================================
*/


function cleanText(text) {

    if (!text) {
        return "";
    }

    return text
        .replace(/<br\s*\/?>/gi, " ")
        .replace(/<[^>]+>/g, "")
        .replace(/\s+/g, " ")
        .trim();
}


/*
============================================================
PARSE HCW
JavaScript equivalent of parse_hcw()
============================================================
*/


function parseHCW(xml) {

    const root =
        xml.documentElement;

    const snapshot =
        directChild(
            root,
            "CurrentSnapshot"
        );

    if (!snapshot) {
        throw new Error(
            "HCW nemá CurrentSnapshot."
        );
    }


    const canvas =
        directChild(
            snapshot,
            "Canvas"
        );

    const timeSlices =
        directChild(
            snapshot,
            "TimeSlices"
        );


    if (!canvas || !timeSlices) {
        throw new Error(
            "HCW nemá Canvas alebo TimeSlices."
        );
    }


    /*
    ---------------------------
    TIME SEQUENCES
    ---------------------------
    */

    const sequences =
        directChildren(
            timeSlices,
            "TimeNumber"
        )
        .map(
            t =>
                parseInt(
                    T(t, "sequence", "0"),
                    10
                )
        )
        .filter(Number.isFinite)
        .sort((a, b) => a - b);


    /*
    ---------------------------
    CHARACTERS
    ---------------------------
    */

    const chars =
        directChildren(
            canvas,
            "Character"
        );


    const sceneStates =
        chars.filter(
            e =>
                objectEvents(e).length > 0
        );


    const templates =
        chars.filter(
            e =>
                objectEvents(e).length === 0
        );


    /*
    ---------------------------
    OTHER HCW OBJECTS
    ---------------------------
    */

    const walks =
        directChildren(
            canvas,
            "WalkArrow"
        );


    const cameras =
        directChildren(
            canvas,
            "Camera"
        );


    const tracks =
        directChildren(
            canvas,
            "Track"
        );


    const props =
        directChildren(
            canvas,
            "GenericProp"
        );


    const lights =
        directChildren(
            canvas,
            "GenericLight"
        );


    const captions =
        directChildren(
            canvas,
            "Caption"
        );


    const background =
        directChild(
            canvas,
            "Background"
        );


    /*
    ---------------------------
    PICTURES
    ---------------------------
    */

    const pictures = new Map();

    const picturesRoot =
        directChild(
            root,
            "Pictures"
        );


    if (picturesRoot) {

        const pictureList =
            directChildren(
                picturesRoot,
                "Picture"
            );

        for (const picture of pictureList) {

            pictures.set(
                T(picture, "uniqueID"),
                T(picture, "base64Data")
            );
        }
    }


    return {

        root,
        snapshot,
        canvas,

        sequences,

        sceneStates,
        templates,

        walks,
        cameras,
        tracks,

        props,
        lights,
        captions,

        background,
        pictures
    };
}


/*
============================================================
LOGICAL ACTOR RECONSTRUCTION

Equivalent of:

build_actor_components(data)

Actor identity is reconstructed from:

1. timed Character states
2. WalkArrow graph
3. template Character signature
4. Caption attachObjectID

============================================================
*/


function buildActorComponents(data) {

    const states =
        data.sceneStates;


    const byId =
        new Map();


    for (const state of states) {

        byId.set(
            T(state, "uniqueID"),
            state
        );
    }


    const stateIDs =
        new Set(
            byId.keys()
        );


    /*
    ---------------------------
    WALKARROW GRAPH
    ---------------------------
    */


    const adjacency =
        new Map();


    for (const uid of stateIDs) {

        adjacency.set(
            uid,
            new Set()
        );
    }


    const actorWalks = [];


    for (const walk of data.walks) {

        const a =
            T(
                walk,
                "fromConstraints"
            );

        const b =
            T(
                walk,
                "toConstraints"
            );


        if (
            stateIDs.has(a) &&
            stateIDs.has(b)
        ) {

            adjacency.get(a).add(b);
            adjacency.get(b).add(a);

            actorWalks.push(walk);
        }
    }


    /*
    ---------------------------
    CONNECTED COMPONENTS
    ---------------------------
    */


    const components = [];

    const seen =
        new Set();


    for (const uid of stateIDs) {

        if (seen.has(uid)) {
            continue;
        }


        const queue = [uid];

        seen.add(uid);

        const component = [];


        while (queue.length > 0) {

            const current =
                queue.pop();

            component.push(
                current
            );


            for (
                const next
                of adjacency.get(current)
            ) {

                if (!seen.has(next)) {

                    seen.add(next);

                    queue.push(next);
                }
            }
        }


        components.push(
            component
        );
    }


    /*
    ---------------------------
    CAPTION NAMES
    ---------------------------
    */


    const captionName =
        new Map();


    for (
        const caption
        of data.captions
    ) {

        const attachID =
            T(
                caption,
                "attachObjectID"
            );


        const text =
            cleanText(
                T(
                    caption,
                    "userText"
                )
            );


        if (
            attachID &&
            text
        ) {

            captionName.set(
                attachID,
                text
            );
        }
    }


    /*
    ---------------------------
    TEMPLATES BY SIGNATURE
    ---------------------------
    */


    const templatesBySignature =
        new Map();


    for (
        const template
        of data.templates
    ) {

        const signature =
            charSignature(
                template
            );


        if (
            !templatesBySignature.has(
                signature
            )
        ) {

            templatesBySignature.set(
                signature,
                []
            );
        }


        templatesBySignature
            .get(signature)
            .push(template);
    }


    /*
    ---------------------------
    BUILD ACTORS
    ---------------------------
    */


    const actors = [];

    const usedNames =
        new Map();


    let componentIndex = 0;


    for (
        const component
        of components
    ) {

        componentIndex++;


        const elements =
            component.map(
                uid =>
                    byId.get(uid)
            );


        const signature =
            charSignature(
                elements[0]
            );


        const matches =
            templatesBySignature.get(
                signature
            ) || [];


        let name = null;


        if (
            matches.length === 1
        ) {

            name =
                captionName.get(
                    T(
                        matches[0],
                        "uniqueID"
                    )
                ) || null;
        }


        /*
        Same fallback as Python parser.
        */


        if (!name) {

            const base =
                T(
                    elements[0],
                    "colorName",
                    "Character"
                ) || "Character";


            const count =
                (usedNames.get(base) || 0)
                + 1;


            usedNames.set(
                base,
                count
            );


            name =
                base +
                "_" +
                count;
        }


        /*
        WalkArrows belonging to this actor.
        */


        const componentSet =
            new Set(
                component
            );


        const walkList = [];


        for (
            const walk
            of actorWalks
        ) {

            const from =
                T(
                    walk,
                    "fromConstraints"
                );


            const to =
                T(
                    walk,
                    "toConstraints"
                );


            if (
                componentSet.has(from) &&
                componentSet.has(to)
            ) {

                walkList.push(
                    walk
                );
            }
        }


        actors.push({

            name,

            stateIDs:
                component,

            states:
                elements,

            walks:
                walkList,

            signature
        });
    }


    return actors;
}


/*
============================================================
WALK POINTS

Python:

[from state XY]
+
ALL stored WalkArrow Points
+
[to state XY]

Nothing is simplified.
============================================================
*/


function walkPoints(
    walk,
    stateById
) {

    const a =
        stateById.get(
            T(
                walk,
                "fromConstraints"
            )
        );


    const b =
        stateById.get(
            T(
                walk,
                "toConstraints"
            )
        );


    if (!a || !b) {
        return [];
    }


    const points = [

        {
            x: F(a, "x"),
            y: F(a, "y")
        }

    ];


    const pointsNode =
        directChild(
            walk,
            "Points"
        );


    if (pointsNode) {

        const storedPoints =
            directChildren(
                pointsNode,
                "Point"
            );


        for (
            const point
            of storedPoints
        ) {

            points.push({

                x:
                    F(
                        point,
                        "x"
                    ),

                y:
                    F(
                        point,
                        "y"
                    )
            });
        }
    }


    points.push({

        x: F(b, "x"),
        y: F(b, "y")
    });


    return points;
}


/*
============================================================
ACTOR TIMELINE DATA

This corresponds to the already proven import logic:

initial state =
earliest TRUE ObjectEvent

WalkArrow movement interval =
sequence immediately before target state
→ target state sequence
============================================================
*/


function buildActorTimeline(
    data,
    actors
) {

    const stateById =
        new Map();


    for (
        const state
        of data.sceneStates
    ) {

        stateById.set(
            T(
                state,
                "uniqueID"
            ),
            state
        );
    }


    const result = [];


    for (
        const actor
        of actors
    ) {

        /*
        Initial physical state.
        */


        const states =
            [...actor.states];


        states.sort(
            (a, b) =>
                firstTrueSeq(a, 999) -
                firstTrueSeq(b, 999)
        );


        const initial =
            states[0];


        /*
        WalkArrow chronological order
        from target state sequence.
        */


        const walks =
            [...actor.walks];


        walks.sort(
            (a, b) => {

                const targetA =
                    stateById.get(
                        T(
                            a,
                            "toConstraints"
                        )
                    );


                const targetB =
                    stateById.get(
                        T(
                            b,
                            "toConstraints"
                        )
                    );


                return (
                    firstTrueSeq(
                        targetA,
                        999
                    )
                    -
                    firstTrueSeq(
                        targetB,
                        999
                    )
                );
            }
        );


        const movements = [];


        for (
            const walk
            of walks
        ) {

            const fromState =
                stateById.get(
                    T(
                        walk,
                        "fromConstraints"
                    )
                );


            const toState =
                stateById.get(
                    T(
                        walk,
                        "toConstraints"
                    )
                );


            if (
                !fromState ||
                !toState
            ) {
                continue;
            }


            const endSequence =
                firstTrueSeq(
                    toState,
                    0
                );


            const startSequence =
                Math.max(
                    0,
                    endSequence - 1
                );


            movements.push({

                walkID:
                    T(
                        walk,
                        "uniqueID"
                    ),

                fromID:
                    T(
                        fromState,
                        "uniqueID"
                    ),

                toID:
                    T(
                        toState,
                        "uniqueID"
                    ),

                startSequence,

                endSequence,

                endAngle:
                    angleOf(
                        toState,
                        "RotatorCharacter"
                    ),

                points:
                    walkPoints(
                        walk,
                        stateById
                    )
            });
        }


        result.push({

            name:
                actor.name,

            initial: {

                stateID:
                    T(
                        initial,
                        "uniqueID"
                    ),

                sequence:
                    firstTrueSeq(
                        initial,
                        0
                    ),

                x:
                    F(
                        initial,
                        "x"
                    ),

                y:
                    F(
                        initial,
                        "y"
                    ),

                angle:
                    angleOf(
                        initial,
                        "RotatorCharacter"
                    )
            },

            movements
        });
    }


    return result;
}


/*
============================================================
CAMERAS / TRACK

Equivalent of create_cameras():

Track membership:

Track fromConstraints
Track toConstraints
+
Camera snapPath == Track uniqueID

TIME ORDER:
first TRUE ObjectEvent

NOT spatial order.
============================================================
*/


function buildCameraData(data) {

    const cameras =
        data.cameras;


    const byId =
        new Map();


    for (
        const camera
        of cameras
    ) {

        byId.set(
            T(
                camera,
                "uniqueID"
            ),
            camera
        );
    }


    const trackMemberIDs =
        new Set();


    const movingCameras = [];


    let trackIndex = 0;


    for (
        const track
        of data.tracks
    ) {

        trackIndex++;


        const trackID =
            T(
                track,
                "uniqueID"
            );


        const ids = [

            T(
                track,
                "fromConstraints"
            ),

            T(
                track,
                "toConstraints"
            )
        ];


        /*
        Camera states snapped to this Track.
        */


        for (
            const camera
            of cameras
        ) {

            if (
                T(
                    camera,
                    "snapPath"
                ) === trackID
            ) {

                ids.push(
                    T(
                        camera,
                        "uniqueID"
                    )
                );
            }
        }


        /*
        Remove duplicate IDs while preserving order.
        */


        const uniqueIDs = [];

        const seen =
            new Set();


        for (
            const id
            of ids
        ) {

            if (
                id &&
                !seen.has(id)
            ) {

                seen.add(id);

                uniqueIDs.push(id);
            }
        }


        const members = [];


        for (
            const uid
            of uniqueIDs
        ) {

            const camera =
                byId.get(uid);


            if (camera) {

                members.push(
                    camera
                );

                trackMemberIDs.add(
                    uid
                );
            }
        }


        if (
            members.length === 0
        ) {
            continue;
        }


        /*
        TIME order from ObjectEvents.
        */


        members.sort(
            (a, b) =>
                firstTrueSeq(a, 999)
                -
                firstTrueSeq(b, 999)
        );


        /*
        Physical Track geometry.
        */


        const trackPoints = [];


        const pointsNode =
            directChild(
                track,
                "Points"
            );


        if (pointsNode) {

            const stored =
                directChildren(
                    pointsNode,
                    "Point"
                );


            for (
                const point
                of stored
            ) {

                trackPoints.push({

                    x:
                        F(
                            point,
                            "x"
                        ),

                    y:
                        F(
                            point,
                            "y"
                        )
                });
            }
        }


        /*
        Same fallback as Python:
        if Track has fewer than 2 stored Points,
        use its from/to camera states.
        */


        if (
            trackPoints.length < 2
        ) {

            const a =
                byId.get(
                    T(
                        track,
                        "fromConstraints"
                    )
                );


            const b =
                byId.get(
                    T(
                        track,
                        "toConstraints"
                    )
                );


            if (
                a &&
                b
            ) {

                trackPoints.length = 0;


                trackPoints.push({

                    x:
                        F(a, "x"),

                    y:
                        F(a, "y")
                });


                trackPoints.push({

                    x:
                        F(b, "x"),

                    y:
                        F(b, "y")
                });
            }
        }


        movingCameras.push({

            name:
                "DOLLY_" +
                String(
                    trackIndex
                ).padStart(
                    2,
                    "0"
                ),

            trackID,

            trackPoints,

            states:
                members.map(
                    camera => ({

                        id:
                            T(
                                camera,
                                "uniqueID"
                            ),

                        sequence:
                            firstTrueSeq(
                                camera,
                                0
                            ),

                        x:
                            F(
                                camera,
                                "x"
                            ),

                        y:
                            F(
                                camera,
                                "y"
                            ),

                        angle:
                            angleOf(
                                camera,
                                "RotatorCamera"
                            ),

                        stopMarks:
                            T(
                                camera,
                                "stopMarks"
                            ),

                        snapPath:
                            T(
                                camera,
                                "snapPath"
                            ),

                        snapPercent:
                            F(
                                camera,
                                "snapPercent"
                            )
                    })
                )
        });
    }


    /*
    ---------------------------
    STATIC CAMERAS
    ---------------------------
    */


    const staticCameras = [];


    let cameraIndex = 0;


    for (
        const camera
        of cameras
    ) {

        cameraIndex++;


        const id =
            T(
                camera,
                "uniqueID"
            );


        if (
            trackMemberIDs.has(id)
        ) {
            continue;
        }


        staticCameras.push({

            name:
                "CAMERA_STATIC_" +
                String(
                    cameraIndex
                ).padStart(
                    2,
                    "0"
                ),

            id,

            sequence:
                firstTrueSeq(
                    camera,
                    0
                ),

            x:
                F(
                    camera,
                    "x"
                ),

            y:
                F(
                    camera,
                    "y"
                ),

            angle:
                angleOf(
                    camera,
                    "RotatorCamera"
                )
        });
    }


    return {

        movingCameras,
        staticCameras
    };
}


/*
============================================================
REPORT
============================================================
*/


function makeReport(
    fileName,
    data,
    actors,
    actorTimeline,
    cameraData
) {

    const lines = [];


    lines.push(
        "HCW súbor: " +
        fileName
    );


    lines.push("");


    lines.push(
        "=== HCW PARSER ==="
    );


    lines.push(
        "Sequences: " +
        data.sequences.length
    );


    lines.push(
        "Character scene states: " +
        data.sceneStates.length
    );


    lines.push(
        "Character templates: " +
        data.templates.length
    );


    lines.push(
        "Logical actors: " +
        actors.length
    );


    lines.push(
        "WalkArrow: " +
        data.walks.length
    );


    lines.push(
        "Camera states: " +
        data.cameras.length
    );


    lines.push(
        "Track: " +
        data.tracks.length
    );


    lines.push(
        "GenericProp: " +
        data.props.length
    );


    lines.push(
        "GenericLight: " +
        data.lights.length
    );


    lines.push(
        "Caption: " +
        data.captions.length
    );


    lines.push("");


    lines.push(
        "SEQUENCE IDs:"
    );


    lines.push(
        data.sequences.join(", ")
    );


    /*
    ========================================================
    ACTORS
    ========================================================
    */


    lines.push("");
    lines.push(
        "========================================"
    );

    lines.push(
        "ACTORS"
    );

    lines.push(
        "========================================"
    );


    for (
        const actor
        of actorTimeline
    ) {

        lines.push("");

        lines.push(
            "ACTOR: " +
            actor.name
        );


        lines.push(
            "Initial state: " +
            actor.initial.stateID
        );


        lines.push(
            "Initial sequence: " +
            actor.initial.sequence
        );


        lines.push(
            "Initial XY: " +
            actor.initial.x +
            ", " +
            actor.initial.y
        );


        lines.push(
            "Initial angle: " +
            actor.initial.angle
        );


        lines.push(
            "Walks: " +
            actor.movements.length
        );


        for (
            let i = 0;
            i < actor.movements.length;
            i++
        ) {

            const movement =
                actor.movements[i];


            lines.push("");

            lines.push(
                "  WALK " +
                (i + 1)
            );


            lines.push(
                "  FROM: " +
                movement.fromID
            );


            lines.push(
                "  TO: " +
                movement.toID
            );


            lines.push(
                "  SEQUENCE: " +
                movement.startSequence +
                " -> " +
                movement.endSequence
            );


            lines.push(
                "  END ANGLE: " +
                movement.endAngle
            );


            lines.push(
                "  POINTS:"
            );


            for (
                const point
                of movement.points
            ) {

                lines.push(
                    "    " +
                    point.x +
                    ", " +
                    point.y
                );
            }
        }
    }


    /*
    ========================================================
    CAMERAS
    ========================================================
    */


    lines.push("");
    lines.push(
        "========================================"
    );

    lines.push(
        "CAMERAS"
    );

    lines.push(
        "========================================"
    );


    for (
        const dolly
        of cameraData.movingCameras
    ) {

        lines.push("");

        lines.push(
            dolly.name
        );


        lines.push(
            "Track ID: " +
            dolly.trackID
        );


        lines.push(
            "Camera states: " +
            dolly.states.length
        );


        for (
            const state
            of dolly.states
        ) {

            lines.push(
                "  seq=" +
                state.sequence +
                "  XY=" +
                state.x +
                "," +
                state.y +
                "  angle=" +
                state.angle +
                "  stopMarks=" +
                state.stopMarks +
                "  snapPercent=" +
                state.snapPercent
            );
        }


        lines.push(
            "Track Points:"
        );


        for (
            const point
            of dolly.trackPoints
        ) {

            lines.push(
                "  " +
                point.x +
                ", " +
                point.y
            );
        }
    }


    for (
        const camera
        of cameraData.staticCameras
    ) {

        lines.push("");

        lines.push(
            camera.name
        );


        lines.push(
            "ID: " +
            camera.id
        );


        lines.push(
            "Sequence: " +
            camera.sequence
        );


        lines.push(
            "XY: " +
            camera.x +
            ", " +
            camera.y
        );


        lines.push(
            "Angle: " +
            camera.angle
        );
    }


    return lines.join("\n");
}


/*
============================================================
MAIN
============================================================
*/


const fileInput =
    document.getElementById(
        "hcwFile"
    );


const openButton =
    document.getElementById(
        "openButton"
    );


const status =
    document.getElementById(
        "status"
    );


const output =
    document.getElementById(
        "output"
    );


openButton.addEventListener(
    "click",
    async () => {

        const file =
            fileInput.files[0];


        if (!file) {

            status.className =
                "error";

            status.textContent =
                "Najprv vyber HCW súbor.";

            return;
        }


        try {

            status.className = "";

            status.textContent =
                "Čítam HCW...";


            output.textContent = "";


            const text =
                await file.text();


            const parser =
                new DOMParser();


            const xml =
                parser.parseFromString(
                    text,
                    "application/xml"
                );


            const parserError =
                xml.getElementsByTagName(
                    "parsererror"
                );


            if (
                parserError.length > 0
            ) {

                throw new Error(
                    "HCW XML sa nepodarilo načítať."
                );
            }


            /*
            ================================================
            EXISTING PROVEN PIPELINE
            ================================================
            */


            const data =
                parseHCW(xml);


            const actors =
                buildActorComponents(
                    data
                );


            const actorTimeline =
                buildActorTimeline(
                    data,
                    actors
                );


            const cameraData =
                buildCameraData(
                    data
                );


            /*
            ================================================
            REPORT
            ================================================
            */


            output.textContent =
                makeReport(
                    file.name,
                    data,
                    actors,
                    actorTimeline,
                    cameraData
                );


            status.className =
                "ok";


            status.textContent =
                "HCW úspešne načítané — parser dokončený.";

        }

        catch (error) {

            console.error(error);


            status.className =
                "error";


            status.textContent =
                "CHYBA: " +
                error.message;
        }
    }
);

</script>
