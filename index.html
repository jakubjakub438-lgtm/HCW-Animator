<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCW Animator</title>
</head>

<body>

<h1>HCW Animator</h1>
<p>Webová verzia HCW Animatora.</p>

<input type="file" id="hcwFile" accept=".hcw">
<button id="openButton">OTVORIŤ HCW</button>

<p id="status">HCW súbor zatiaľ nie je otvorený.</p>

<script>

const hcwFile = document.getElementById("hcwFile");
const openButton = document.getElementById("openButton");
const status = document.getElementById("status");


function directValue(element, tagName, defaultValue = "") {
    for (const child of element.children) {
        if (child.tagName === tagName) {
            return child.textContent.trim();
        }
    }
    return defaultValue;
}


function objectEvents(element) {

    const result = [];

    for (const child of element.children) {

        if (child.tagName !== "ObjectEvents") {
            continue;
        }

        for (const event of child.children) {

            if (event.tagName !== "OnOffEvent") {
                continue;
            }

            const sequenceText =
                directValue(event, "sequence", "0");

            const activeText =
                directValue(event, "active", "false");

            const disabledText =
                directValue(event, "disabledRotators", "");

            const sequence =
                Number.parseInt(sequenceText, 10);

            result.push({
                sequence:
                    Number.isNaN(sequence) ? 0 : sequence,

                active:
                    activeText.toLowerCase() === "true",

                disabledRotators:
                    disabledText
            });
        }
    }

    return result;
}


openButton.addEventListener("click", async () => {

    const file = hcwFile.files[0];

    if (!file) {
        status.textContent = "Najprv vyber HCW súbor.";
        return;
    }

    try {

        const content = await file.text();

        if (content.length === 0) {
            status.textContent =
                "CHYBA: HCW súbor je prázdny.";
            return;
        }


        const parser = new DOMParser();

        const xml =
            parser.parseFromString(
                content,
                "text/xml"
            );


        if (xml.querySelector("parsererror")) {
            status.textContent =
                "CHYBA: HCW súbor sa nepodarilo rozpoznať ako XML.";
            return;
        }


        const characters =
            xml.getElementsByTagName("Character");

        const cameras =
            xml.getElementsByTagName("Camera");

        const walkArrows =
            xml.getElementsByTagName("WalkArrow");

        const tracks =
            xml.getElementsByTagName("Track");

        const timeNumbers =
            xml.getElementsByTagName("TimeNumber");

        const allOnOffEvents =
            xml.getElementsByTagName("OnOffEvent");


        /*
        ========================================
        CHARACTER DATA
        ========================================
        */

        let characterData = "";


        for (let i = 0; i < characters.length; i++) {

            const character = characters[i];

            const characterID =
                directValue(character, "uniqueID");

            const characterX =
                directValue(character, "x");

            const characterY =
                directValue(character, "y");

            const characterColor =
                directValue(character, "color");

            const characterColorName =
                directValue(character, "colorName");


            const subObjects =
                Array.from(character.children)
                .find(
                    child =>
                        child.tagName === "SubObjects"
                );


            const rotators = subObjects
                ? Array.from(subObjects.children)
                    .filter(
                        child =>
                            child.tagName ===
                            "RotatorCharacter"
                    )
                : [];


            characterData +=

                "<br><br><strong>Character " +
                (i + 1) +
                "</strong><br>" +

                "ID: " +
                characterID +
                "<br>" +

                "X: " +
                characterX +
                "<br>" +

                "Y: " +
                characterY +
                "<br>" +

                "Color: " +
                characterColor +
                "<br>" +

                "ColorName: " +
                characterColorName +
                "<br>" +

                "<strong>RotatorCharacter: " +
                rotators.length +
                "</strong><br>";


            for (let r = 0; r < rotators.length; r++) {

                characterData +=

                    "Rotator " +
                    (r + 1) +
                    "<br>" +

                    "ID: " +
                    directValue(
                        rotators[r],
                        "uniqueID"
                    ) +
                    "<br>" +

                    "Angle: " +
                    directValue(
                        rotators[r],
                        "angle"
                    ) +
                    "<br>";
            }
        }


        /*
        ========================================
        SITUATION -> CHARACTER -> ROTATOR
        ========================================
        */

        let situationData = "";

        situationData +=
            "<br><br><strong>" +
            "SITUÁCIA → CHARACTER → AKTÍVNY ROTATOR" +
            "</strong><br>";


        const situations = new Map();


        for (const character of characters) {

            const events =
                objectEvents(character);


            /*
            Character bez ObjectEvents je template,
            nie časovaný scene state.
            */

            if (events.length === 0) {
                continue;
            }


            const characterID =
                directValue(
                    character,
                    "uniqueID"
                );


            const characterX =
                directValue(
                    character,
                    "x"
                );


            const characterY =
                directValue(
                    character,
                    "y"
                );


            const colorName =
                directValue(
                    character,
                    "colorName"
                );


            const subObjects =
                Array.from(character.children)
                .find(
                    child =>
                        child.tagName === "SubObjects"
                );


            const rotators = subObjects
                ? Array.from(subObjects.children)
                    .filter(
                        child =>
                            child.tagName ===
                            "RotatorCharacter"
                    )
                : [];


            for (const event of events) {

                if (!event.active) {
                    continue;
                }


                if (!situations.has(event.sequence)) {
                    situations.set(
                        event.sequence,
                        []
                    );
                }


                const disabledIDs =
                    event.disabledRotators
                        .split(/[\s,;]+/)
                        .filter(Boolean);


                const activeRotators = [];


                for (const rotator of rotators) {

                    const rotatorID =
                        directValue(
                            rotator,
                            "uniqueID"
                        );


                    if (
                        disabledIDs.includes(
                            rotatorID
                        )
                    ) {
                        continue;
                    }


                    activeRotators.push({
                        id: rotatorID,
                        angle:
                            directValue(
                                rotator,
                                "angle"
                            )
                    });
                }


                situations.get(event.sequence).push({

                    characterID:
                        characterID,

                    x:
                        characterX,

                    y:
                        characterY,

                    colorName:
                        colorName,

                    disabledRotators:
                        event.disabledRotators,

                    activeRotators:
                        activeRotators
                });
            }
        }


        const sortedSequences =
            Array.from(situations.keys())
                .sort((a, b) => a - b);


        for (const sequence of sortedSequences) {

            situationData +=
                "<br><br><strong>SITUÁCIA " +
                sequence +
                "</strong><br>";


            const states =
                situations.get(sequence);


            for (const state of states) {

                situationData +=

                    "<br>" +

                    "Character: " +
                    state.characterID +
                    "<br>" +

                    "X: " +
                    state.x +
                    "<br>" +

                    "Y: " +
                    state.y +
                    "<br>" +

                    "ColorName: " +
                    state.colorName +
                    "<br>" +

                    "DisabledRotators: " +
                    state.disabledRotators +
                    "<br>";


                if (
                    state.activeRotators.length === 0
                ) {

                    situationData +=
                        "Aktívny RotatorCharacter: NONE<br>";

                } else {

                    for (
                        let r = 0;
                        r < state.activeRotators.length;
                        r++
                    ) {

                        situationData +=

                            "Aktívny RotatorCharacter " +
                            (r + 1) +
                            ": " +
                            state.activeRotators[r].id +
                            "<br>" +

                            "Angle: " +
                            state.activeRotators[r].angle +
                            "<br>";
                    }
                }
            }
        }


        /*
        ========================================
        OUTPUT
        ========================================
        */


        status.innerHTML =

            "HCW súbor bol úspešne prečítaný: " +
            file.name +

            "<br><br>" +

            "<strong>HCW ŠTRUKTÚRA:</strong><br>" +

            "Character: " +
            characters.length +
            "<br>" +

            "Camera: " +
            cameras.length +
            "<br>" +

            "WalkArrow: " +
            walkArrows.length +
            "<br>" +

            "Track: " +
            tracks.length +
            "<br>" +

            "TimeNumber: " +
            timeNumbers.length +
            "<br>" +

            "OnOffEvent: " +
            allOnOffEvents.length +

            "<br><br>" +

            "<strong>CHARACTER DATA:</strong>" +

            characterData +

            situationData;


    } catch (error) {

        status.textContent =
            "CHYBA: HCW súbor sa nepodarilo prečítať.";

        console.error(error);
    }

});

</script>

</body>
</html>
