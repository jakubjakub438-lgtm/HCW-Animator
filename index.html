<script>

/*
============================================================
SHOT DESIGNER HCW -> WEB
============================================================

ZDROJ LOGIKY:

ShotDesigner_HCW_to_Blender_v2_0_UNIVERSAL.py

PRAVIDLO:

TECHNICKÝ PREPIS - BEZ INTERPRETÁCIE.

Žiadne scene-specific súradnice.
Žiadne ručné mená hercov.
Žiadne domýšľanie spojení.

============================================================
*/


/*
============================================================
XML HELPERS
Python:

T(e, tag)
F(e, tag)
============================================================
*/


function directChild(element, tagName) {

    if (!element) {
        return null;
    }

    for (let i = 0; i < element.childNodes.length; i++) {

        const node = element.childNodes[i];

        if (
            node.nodeType === 1 &&
            node.nodeName === tagName
        ) {
            return node;
        }
    }

    return null;
}


function directChildren(element, tagName) {

    const result = [];

    if (!element) {
        return result;
    }

    for (let i = 0; i < element.childNodes.length; i++) {

        const node = element.childNodes[i];

        if (
            node.nodeType === 1 &&
            node.nodeName === tagName
        ) {
            result.push(node);
        }
    }

    return result;
}


function T(element, tagName, defaultValue = "") {

    const node = directChild(element, tagName);

    if (!node) {
        return defaultValue;
    }

    if (node.textContent === null) {
        return defaultValue;
    }

    return node.textContent.trim();
}


function F(element, tagName, defaultValue = 0.0) {

    const value = Number(
        T(element, tagName, String(defaultValue))
    );

    return Number.isFinite(value)
        ? value
        : Number(defaultValue);
}


/*
============================================================
OBJECT EVENTS
Python equivalent:

def object_events(e):
    q = e.find("ObjectEvents")
    if q is None:
        return []

    for z in q.findall("OnOffEvent"):
        seq = int(T(z,"sequence","0"))
        active = T(z,"active","false").lower()=="true"
============================================================
*/


function objectEvents(element) {

    const q = directChild(
        element,
        "ObjectEvents"
    );

    if (!q) {
        return [];
    }

    const out = [];

    const events = directChildren(
        q,
        "OnOffEvent"
    );

    for (const z of events) {

        let sequence =
            parseInt(
                T(z, "sequence", "0"),
                10
            );

        if (!Number.isFinite(sequence)) {
            sequence = 0;
        }

        const active =
            T(
                z,
                "active",
                "false"
            ).toLowerCase() === "true";

        out.push({
            sequence,
            active
        });
    }

    return out;
}


/*
============================================================
FIRST TRUE SEQUENCE
============================================================
*/


function firstTrueSeq(element, defaultValue = 0) {

    const vals =
        objectEvents(element)
        .filter(event => event.active)
        .map(event => event.sequence);

    if (vals.length === 0) {
        return defaultValue;
    }

    return Math.min(...vals);
}


/*
============================================================
ANGLE
Python:

e.find("SubObjects/" + subtag + "/angle")
============================================================
*/


function angleOf(element, subtag) {

    const subObjects =
        directChild(
            element,
            "SubObjects"
        );

    if (!subObjects) {
        return 0.0;
    }

    const rotator =
        directChild(
            subObjects,
            subtag
        );

    if (!rotator) {
        return 0.0;
    }

    const angle =
        Number(
            T(
                rotator,
                "angle",
                "0"
            )
        );

    return Number.isFinite(angle)
        ? angle
        : 0.0;
}


/*
============================================================
CHARACTER SIGNATURE
Python:

(colorName, colorIndex, female)
============================================================
*/


function charSignature(element) {

    return [
        T(element, "colorName"),
        T(element, "colorIndex"),
        T(element, "female")
    ].join("|");
}


/*
============================================================
CLEAN CAPTION TEXT
============================================================
*/


function cleanText(text) {

    if (!text) {
        return "";
    }

    return text
        .replace(/<br\s*\/?>/gi, " ")
        .replace(/<[^>]+>/g, "")
        .replace(/\s+/g, " ")
        .trim();
}


/*
============================================================
PARSE HCW
JavaScript equivalent of parse_hcw()
============================================================
*/


function parseHCW(xml) {

    const root =
        xml.documentElement;

    const snapshot =
        directChild(
            root,
            "CurrentSnapshot"
        );

    if (!snapshot) {
        throw new Error(
            "HCW nemá CurrentSnapshot."
        );
    }


    const canvas =
        directChild(
            snapshot,
            "Canvas"
        );

    const timeSlices =
        directChild(
            snapshot,
            "TimeSlices"
        );


    if (!canvas || !timeSlices) {
        throw new Error(
            "HCW nemá Canvas alebo TimeSlices."
        );
    }


    /*
    ---------------------------
    TIME SEQUENCES
    ---------------------------
    */

    const sequences =
        directChildren(
            timeSlices,
            "TimeNumber"
        )
        .map(
            t =>
                parseInt(
                    T(t, "sequence", "0"),
                    10
                )
        )
        .filter(Number.isFinite)
        .sort((a, b) => a - b);


    /*
    ---------------------------
    CHARACTERS
    ---------------------------
    */

    const chars =
        directChildren(
            canvas,
            "Character"
        );


    const sceneStates =
        chars.filter(
            e =>
                objectEvents(e).length > 0
        );


    const templates =
        chars.filter(
            e =>
                objectEvents(e).length === 0
        );


    /*
    ---------------------------
    OTHER HCW OBJECTS
    ---------------------------
    */

    const walks =
        directChildren(
            canvas,
            "WalkArrow"
        );


    const cameras =
        directChildren(
            canvas,
            "Camera"
        );


    const tracks =
        directChildren(
            canvas,
            "Track"
        );


    const props =
        directChildren(
            canvas,
            "GenericProp"
        );


    const lights =
        directChildren(
            canvas,
            "GenericLight"
        );


    const captions =
        directChildren(
            canvas,
            "Caption"
        );


    const background =
        directChild(
            canvas,
            "Background"
        );


    /*
    ---------------------------
    PICTURES
    ---------------------------
    */

    const pictures = new Map();

    const picturesRoot =
        directChild(
            root,
            "Pictures"
        );


    if (picturesRoot) {

        const pictureList =
            directChildren(
                picturesRoot,
                "Picture"
            );

        for (const picture of pictureList) {

            pictures.set(
                T(picture, "uniqueID"),
                T(picture, "base64Data")
            );
        }
    }


    return {

        root,
        snapshot,
        canvas,

        sequences,

        sceneStates,
        templates,

        walks,
        cameras,
        tracks,

        props,
        lights,
        captions,

        background,
        pictures
    };
}


/*
============================================================
LOGICAL ACTOR RECONSTRUCTION

Equivalent of:

build_actor_components(data)

Actor identity is reconstructed from:

1. timed Character states
2. WalkArrow graph
3. template Character signature
4. Caption attachObjectID

============================================================
*/


function buildActorComponents(data) {

    const states =
        data.sceneStates;


    const byId =
        new Map();


    for (const state of states) {

        byId.set(
            T(state, "uniqueID"),
            state
        );
    }


    const stateIDs =
        new Set(
            byId.keys()
        );


    /*
    ---------------------------
    WALKARROW GRAPH
    ---------------------------
    */


    const adjacency =
        new Map();


    for (const uid of stateIDs) {

        adjacency.set(
            uid,
            new Set()
        );
    }


    const actorWalks = [];


    for (const walk of data.walks) {

        const a =
            T(
                walk,
                "fromConstraints"
            );

        const b =
            T(
                walk,
                "toConstraints"
            );


        if (
            stateIDs.has(a) &&
            stateIDs.has(b)
        ) {

            adjacency.get(a).add(b);
            adjacency.get(b).add(a);

            actorWalks.push(walk);
        }
    }


    /*
    ---------------------------
    CONNECTED COMPONENTS
    ---------------------------
    */


    const components = [];

    const seen =
        new Set();


    for (const uid of stateIDs) {

        if (seen.has(uid)) {
            continue;
        }


        const queue = [uid];

        seen.add(uid);

        const component = [];


        while (queue.length > 0) {

            const current =
                queue.pop();

            component.push(
                current
            );


            for (
                const next
                of adjacency.get(current)
            ) {

                if (!seen.has(next)) {

                    seen.add(next);

                    queue.push(next);
                }
            }
        }


        components.push(
            component
        );
    }


    /*
    ---------------------------
    CAPTION NAMES
    ---------------------------
    */


    const captionName =
        new Map();


    for (
        const caption
        of data.captions
    ) {

        const attachID =
            T(
                caption,
                "attachObjectID"
            );


        const text =
            cleanText(
                T(
                    caption,
                    "userText"
                )
            );


        if (
            attachID &&
            text
        ) {

            captionName.set(
                attachID,
                text
            );
        }
    }


    /*
    ---------------------------
    TEMPLATES BY SIGNATURE
    ---------------------------
    */


    const templatesBySignature =
        new Map();


    for (
        const template
        of data.templates
    ) {

        const signature =
            charSignature(
                template
            );


        if (
            !templatesBySignature.has(
                signature
            )
        ) {

            templatesBySignature.set(
                signature,
                []
            );
        }


        templatesBySignature
            .get(signature)
            .push(template);
    }


    /*
    ---------------------------
    BUILD ACTORS
    ---------------------------
    */


    const actors = [];

    const usedNames =
        new Map();


    let componentIndex = 0;


    for (
        const component
        of components
    ) {

        componentIndex++;


        const elements =
            component.map(
                uid =>
                    byId.get(uid)
            );


        const signature =
            charSignature(
                elements[0]
            );


        const matches =
            templatesBySignature.get(
                signature
            ) || [];


        let name = null;


        if (
            matches.length === 1
        ) {

            name =
                captionName.get(
                    T(
                        matches[0],
                        "uniqueID"
                    )
                ) || null;
        }


        /*
        Same fallback as Python parser.
        */


        if (!name) {

            const base =
                T(
                    elements[0],
                    "colorName",
                    "Character"
                ) || "Character";


            const count =
                (usedNames.get(base) || 0)
                + 1;


            usedNames.set(
                base,
                count
            );


            name =
                base +
                "_" +
                count;
        }


        /*
        WalkArrows belonging to this actor.
        */


        const componentSet =
            new Set(
                component
            );


        const walkList = [];


        for (
            const walk
            of actorWalks
        ) {

            const from =
                T(
                    walk,
                    "fromConstraints"
                );


            const to =
                T(
                    walk,
                    "toConstraints"
                );


            if (
                componentSet.has(from) &&
                componentSet.has(to)
            ) {

                walkList.push(
                    walk
                );
            }
        }


        actors.push({

            name,

            stateIDs:
                component,

            states:
                elements,

            walks:
                walkList,

            signature
        });
    }


    return actors;
}


/*
============================================================
WALK POINTS

Python:

[from state XY]
+
ALL stored WalkArrow Points
+
[to state XY]

Nothing is simplified.
============================================================
*/


function walkPoints(
    walk,
    stateById
) {

    const a =
        stateById.get(
            T(
                walk,
                "fromConstraints"
            )
        );


    const b =
        stateById.get(
            T(
                walk,
                "toConstraints"
            )
        );


    if (!a || !b) {
        return [];
    }


    const points = [

        {
            x: F(a, "x"),
            y: F(a, "y")
        }

    ];


    const pointsNode =
        directChild(
            walk,
            "Points"
        );


    if (pointsNode) {

        const storedPoints =
            directChildren(
                pointsNode,
                "Point"
            );


        for (
            const point
            of storedPoints
        ) {

            points.push({

                x:
                    F(
                        point,
                        "x"
                    ),

                y:
                    F(
                        point,
                        "y"
                    )
            });
        }
    }


    points.push({

        x: F(b, "x"),
        y: F(b, "y")
    });


    return points;
}


/*
============================================================
ACTOR TIMELINE DATA

This corresponds to the already proven import logic:

initial state =
earliest TRUE ObjectEvent

WalkArrow movement interval =
sequence immediately before target state
→ target state sequence
============================================================
*/


function buildActorTimeline(
    data,
    actors
) {

    const stateById =
        new Map();


    for (
        const state
        of data.sceneStates
    ) {

        stateById.set(
            T(
                state,
                "uniqueID"
            ),
            state
        );
    }


    const result = [];


    for (
        const actor
        of actors
    ) {

        /*
        Initial physical state.
        */


        const states =
            [...actor.states];


        states.sort(
            (a, b) =>
                firstTrueSeq(a, 999) -
                firstTrueSeq(b, 999)
        );


        const initial =
            states[0];


        /*
        WalkArrow chronological order
        from target state sequence.
        */


        const walks =
            [...actor.walks];


        walks.sort(
            (a, b) => {

                const targetA =
                    stateById.get(
                        T(
                            a,
                            "toConstraints"
                        )
                    );


                const targetB =
                    stateById.get(
                        T(
                            b,
                            "toConstraints"
                        )
                    );


                return (
                    firstTrueSeq(
                        targetA,
                        999
                    )
                    -
                    firstTrueSeq(
                        targetB,
                        999
                    )
                );
            }
        );


        const movements = [];


        for (
            const walk
            of walks
        ) {

            const fromState =
                stateById.get(
                    T(
                        walk,
                        "fromConstraints"
                    )
                );


            const toState =
                stateById.get(
                    T(
                        walk,
                        "toConstraints"
                    )
                );


            if (
                !fromState ||
                !toState
            ) {
                continue;
            }


            const endSequence =
                firstTrueSeq(
                    toState,
                    0
                );


            const startSequence =
                Math.max(
                    0,
                    endSequence - 1
                );


            movements.push({

                walkID:
                    T(
                        walk,
                        "uniqueID"
                    ),

                fromID:
                    T(
                        fromState,
                        "uniqueID"
                    ),

                toID:
                    T(
                        toState,
                        "uniqueID"
                    ),

                startSequence,

                endSequence,

                endAngle:
                    angleOf(
                        toState,
                        "RotatorCharacter"
                    ),

                points:
                    walkPoints(
                        walk,
                        stateById
                    )
            });
        }


        result.push({

            name:
                actor.name,

            initial: {

                stateID:
                    T(
                        initial,
                        "uniqueID"
                    ),

                sequence:
                    firstTrueSeq(
                        initial,
                        0
                    ),

                x:
                    F(
                        initial,
                        "x"
                    ),

                y:
                    F(
                        initial,
                        "y"
                    ),

                angle:
                    angleOf(
                        initial,
                        "RotatorCharacter"
                    )
            },

            movements
        });
    }


    return result;
}


/*
============================================================
CAMERAS / TRACK

Equivalent of create_cameras():

Track membership:

Track fromConstraints
Track toConstraints
+
Camera snapPath == Track uniqueID

TIME ORDER:
first TRUE ObjectEvent

NOT spatial order.
============================================================
*/


function buildCameraData(data) {

    const cameras =
        data.cameras;


    const byId =
        new Map();


    for (
        const camera
        of cameras
    ) {

        byId.set(
            T(
                camera,
                "uniqueID"
            ),
            camera
        );
    }


    const trackMemberIDs =
        new Set();


    const movingCameras = [];


    let trackIndex = 0;


    for (
        const track
        of data.tracks
    ) {

        trackIndex++;


        const trackID =
            T(
                track,
                "uniqueID"
            );


        const ids = [

            T(
                track,
                "fromConstraints"
            ),

            T(
                track,
                "toConstraints"
            )
        ];


        /*
        Camera states snapped to this Track.
        */


        for (
            const camera
            of cameras
        ) {

            if (
                T(
                    camera,
                    "snapPath"
                ) === trackID
            ) {

                ids.push(
                    T(
                        camera,
                        "uniqueID"
                    )
                );
            }
        }


        /*
        Remove duplicate IDs while preserving order.
        */


        const uniqueIDs = [];

        const seen =
            new Set();


        for (
            const id
            of ids
        ) {

            if (
                id &&
                !seen.has(id)
            ) {

                seen.add(id);

                uniqueIDs.push(id);
            }
        }


        const members = [];


        for (
            const uid
            of uniqueIDs
        ) {

            const camera =
                byId.get(uid);


            if (camera) {

                members.push(
                    camera
                );

                trackMemberIDs.add(
                    uid
                );
            }
        }


        if (
            members.length === 0
        ) {
            continue;
        }


        /*
        TIME order from ObjectEvents.
        */


        members.sort(
            (a, b) =>
                firstTrueSeq(a, 999)
                -
                firstTrueSeq(b, 999)
        );


        /*
        Physical Track geometry.
        */


        const trackPoints = [];


        const pointsNode =
            directChild(
                track,
                "Points"
            );


        if (pointsNode) {

            const stored =
                directChildren(
                    pointsNode,
                    "Point"
                );


            for (
                const point
                of stored
            ) {

                trackPoints.push({

                    x:
                        F(
                            point,
                            "x"
                        ),

                    y:
                        F(
                            point,
                            "y"
                        )
                });
            }
        }


        /*
        Same fallback as Python:
        if Track has fewer than 2 stored Points,
        use its from/to camera states.
        */


        if (
            trackPoints.length < 2
        ) {

            const a =
                byId.get(
                    T(
                        track,
                        "fromConstraints"
                    )
                );


            const b =
                byId.get(
                    T(
                        track,
                        "toConstraints"
                    )
                );


            if (
                a &&
                b
            ) {

                trackPoints.length = 0;


                trackPoints.push({

                    x:
                        F(a, "x"),

                    y:
                        F(a, "y")
                });


                trackPoints.push({

                    x:
                        F(b, "x"),

                    y:
                        F(b, "y")
                });
            }
        }


        movingCameras.push({

            name:
                "DOLLY_" +
                String(
                    trackIndex
                ).padStart(
                    2,
                    "0"
                ),

            trackID,

            trackPoints,

            states:
                members.map(
                    camera => ({

                        id:
                            T(
                                camera,
                                "uniqueID"
                            ),

                        sequence:
                            firstTrueSeq(
                                camera,
                                0
                            ),

                        x:
                            F(
                                camera,
                                "x"
                            ),

                        y:
                            F(
                                camera,
                                "y"
                            ),

                        angle:
                            angleOf(
                                camera,
                                "RotatorCamera"
                            ),

                        stopMarks:
                            T(
                                camera,
                                "stopMarks"
                            ),

                        snapPath:
                            T(
                                camera,
                                "snapPath"
                            ),

                        snapPercent:
                            F(
                                camera,
                                "snapPercent"
                            )
                    })
                )
        });
    }


    /*
    ---------------------------
    STATIC CAMERAS
    ---------------------------
    */


    const staticCameras = [];


    let cameraIndex = 0;


    for (
        const camera
        of cameras
    ) {

        cameraIndex++;


        const id =
            T(
                camera,
                "uniqueID"
            );


        if (
            trackMemberIDs.has(id)
        ) {
            continue;
        }


        staticCameras.push({

            name:
                "CAMERA_STATIC_" +
                String(
                    cameraIndex
                ).padStart(
                    2,
                    "0"
                ),

            id,

            sequence:
                firstTrueSeq(
                    camera,
                    0
                ),

            x:
                F(
                    camera,
                    "x"
                ),

            y:
                F(
                    camera,
                    "y"
                ),

            angle:
                angleOf(
                    camera,
                    "RotatorCamera"
                )
        });
    }


    return {

        movingCameras,
        staticCameras
    };
}

/*
============================================================
2D ANIMATION PLAYER + MP4 EXPORT
============================================================

LOCK:
- Existing parser above is not replaced.
- Every HCW situation transition lasts exactly 1.5 s.
- Every reached situation holds exactly 1.0 s.
- WalkArrow geometry is [FROM] + every stored Point + [TO].
- Distance inside a WalkArrow is distributed by cumulative polyline length.
- Same XY + changed active rotator = turn in place.
- No actor/camera names or scene coordinates are hard-coded.
============================================================
*/

const MOVE_SECONDS = 1.5;
const HOLD_SECONDS = 1.0;
const EXPORT_FPS = 24;

let playerModel = null;
let animationRAF = null;
let animationStartMS = 0;
let currentAnimationSeconds = 0;
let isPlaying = false;
let recordingState = null;

function allRotators(element, subtag) {
    const subObjects = directChild(element, "SubObjects");
    if (!subObjects) return [];
    return directChildren(subObjects, subtag).map(r => ({
        id: T(r, "uniqueID"),
        angle: F(r, "angle", 0)
    }));
}

function detailedObjectEvents(element) {
    const q = directChild(element, "ObjectEvents");
    if (!q) return [];
    return directChildren(q, "OnOffEvent").map(z => ({
        sequence: parseInt(T(z, "sequence", "0"), 10) || 0,
        active: T(z, "active", "false").toLowerCase() === "true",
        disabledRotators: T(z, "disabledRotators", "")
            .split(",").map(x => x.trim()).filter(Boolean)
    })).sort((a,b) => a.sequence - b.sequence);
}

function latestEventAtOrBefore(element, sequence) {
    let found = null;
    for (const ev of detailedObjectEvents(element)) {
        if (ev.sequence <= sequence) found = ev;
        else break;
    }
    return found;
}

function activeAngleAtSequence(element, subtag, sequence) {
    const rotators = allRotators(element, subtag);
    if (rotators.length === 0) return 0;
    const ev = latestEventAtOrBefore(element, sequence);
    if (!ev) return rotators.length === 1 ? rotators[0].angle : null;
    const disabled = new Set(ev.disabledRotators);
    const enabled = rotators.filter(r => !disabled.has(r.id));
    if (enabled.length === 1) return enabled[0].angle;
    if (rotators.length === 1 && enabled.length === 1) return enabled[0].angle;
    return null;
}

function stateIsActiveAtSequence(state, sequence) {
    const ev = latestEventAtOrBefore(state, sequence);
    return !!(ev && ev.active);
}

function actorSituationState(actor, sequence) {
    const active = actor.states.filter(s => stateIsActiveAtSequence(s, sequence));
    if (active.length === 0) return null;
    if (active.length > 1) {
        throw new Error(`Actor ${actor.name}: v situácii ${sequence} je aktívnych viac Character stavov.`);
    }
    const state = active[0];
    const angle = activeAngleAtSequence(state, "RotatorCharacter", sequence);
    if (angle === null) {
        throw new Error(`Actor ${actor.name}: v situácii ${sequence} nie je jednoznačný aktívny RotatorCharacter.`);
    }
    return {
        id: T(state, "uniqueID"),
        x: F(state, "x"),
        y: F(state, "y"),
        angle,
        colorName: T(state, "colorName", "Character"),
        state
    };
}

function cameraSituationState(camera, sequence) {
    if (!stateIsActiveAtSequence(camera, sequence)) return null;
    const angle = activeAngleAtSequence(camera, "RotatorCamera", sequence);
    if (angle === null) {
        throw new Error(`Camera ${T(camera,"uniqueID")}: v situácii ${sequence} nie je jednoznačný aktívny RotatorCamera.`);
    }
    return {
        id: T(camera, "uniqueID"),
        x: F(camera, "x"),
        y: F(camera, "y"),
        angle,
        stopMarks: T(camera, "stopMarks", ""),
        colorIndex: T(camera, "colorIndex", ""),
        camera
    };
}

function shortestAngleDelta(a, b) {
    let d = (b - a) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
}

function lerpAngle(a, b, t) {
    return a + shortestAngleDelta(a, b) * t;
}

function polylineMetrics(points) {
    const cumulative = [0];
    for (let i=1; i<points.length; i++) {
        cumulative.push(cumulative[i-1] + Math.hypot(
            points[i].x - points[i-1].x,
            points[i].y - points[i-1].y
        ));
    }
    return { cumulative, total: cumulative[cumulative.length-1] || 0 };
}

function pointOnPolyline(points, progress, endAngle, startAngle) {
    if (!points || points.length === 0) return {x:0,y:0,angle:endAngle};
    if (points.length === 1) return {x:points[0].x,y:points[0].y,angle:lerpAngle(startAngle,endAngle,progress)};
    const m = polylineMetrics(points);
    if (m.total === 0) {
        return {x:points[0].x,y:points[0].y,angle:lerpAngle(startAngle,endAngle,progress)};
    }
    const target = Math.max(0, Math.min(1, progress)) * m.total;
    let seg = points.length - 2;
    for (let i=0; i<m.cumulative.length-1; i++) {
        if (target <= m.cumulative[i+1]) { seg = i; break; }
    }
    const d0 = m.cumulative[seg], d1 = m.cumulative[seg+1];
    const u = d1 === d0 ? 0 : (target-d0)/(d1-d0);
    const a = points[seg], b = points[seg+1];
    const angle = progress >= 1 ? endAngle : Math.atan2(b.y-a.y, b.x-a.x);
    return {x:a.x+(b.x-a.x)*u, y:a.y+(b.y-a.y)*u, angle};
}

// HCW WalkArrow with exactly two stored interior points: evaluate the
// four-point cubic curve rather than forcing travel THROUGH its handles.
// This is a targeted interpretation pending verification against Shot Designer.
function pointOnCubicWalk(points, progress, endAngle, startAngle) {
    if (points.length !== 4) return pointOnPolyline(points, progress, endAngle, startAngle);
    const t = Math.max(0, Math.min(1, progress));
    const u = 1 - t;
    const [a,c1,c2,b] = points;
    const x = u*u*u*a.x + 3*u*u*t*c1.x + 3*u*t*t*c2.x + t*t*t*b.x;
    const y = u*u*u*a.y + 3*u*u*t*c1.y + 3*u*t*t*c2.y + t*t*t*b.y;
    return {x,y,angle:lerpAngle(startAngle,endAngle,t)};
}

function findActorWalk(actor, fromID, toID, stateById) {
    for (const walk of actor.walks) {
        if (T(walk,"fromConstraints") === fromID && T(walk,"toConstraints") === toID) {
            return walkPoints(walk, stateById);
        }
    }
    return null;
}


function imageMimeFromBase64(base64) {
    if (base64.startsWith("iVBOR")) return "image/png";
    if (base64.startsWith("/9j/")) return "image/jpeg";
    if (base64.startsWith("R0lGOD")) return "image/gif";
    if (base64.startsWith("UklGR")) return "image/webp";
    return "application/octet-stream";
}

function loadHCWBackground(data) {
    return new Promise((resolve, reject) => {
        const bg = data.background;
        if (!bg) { resolve(null); return; }
        const pictureID = T(bg, "pictureUniqueID", "");
        if (!pictureID) { resolve(null); return; }
        const base64 = data.pictures.get(pictureID);
        if (!base64) {
            reject(new Error(`HCW Background odkazuje na Picture ${pictureID}, ale jeho base64Data v HCW chýba.`));
            return;
        }
        const img = new Image();
        img.onload = () => {
            const subObjects = directChild(bg, "SubObjects");
            const rotator = subObjects ? directChild(subObjects, "RotatorObject") : null;
            resolve({
                element: bg,
                image: img,
                x: F(bg, "x", 0),
                y: F(bg, "y", 0),
                scaleX: F(bg, "objectScaleX", 1),
                scaleY: F(bg, "objectScaleY", 1),
                angle: rotator ? F(rotator, "angle", 0) : 0,
                width: img.naturalWidth,
                height: img.naturalHeight,
                pictureID
            });
        };
        img.onerror = () => reject(new Error(`HCW Background Picture ${pictureID} sa nepodarilo dekódovať.`));
        img.src = `data:${imageMimeFromBase64(base64)};base64,${base64}`;
    });
}

function backgroundCorners(bg) {
    if (!bg) return [];
    const hw = bg.width * bg.scaleX / 2;
    const hh = bg.height * bg.scaleY / 2;
    const c = Math.cos(bg.angle), s = Math.sin(bg.angle);
    return [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([dx,dy]) => ({
        x: bg.x + dx*c - dy*s,
        y: bg.y + dx*s + dy*c
    }));
}


function strictHCWAudit(data, actors) {
    const problems = [];

    // HCW GenericProp and GenericLight must never block playback.
    // Preserve the existing actor/camera animation unchanged.

    const stateById = new Map(data.sceneStates.map(s => [T(s,"uniqueID"), s]));

    // Every spatial actor-state change must have its exact HCW WalkArrow.
    for (const actor of actors) {
        const states = actor.states.slice().sort((a,b) => firstTrueSeq(a,999999)-firstTrueSeq(b,999999));
        for (let i=0; i<states.length-1; i++) {
            const a=states[i], b=states[i+1];
            const ax=F(a,"x"), ay=F(a,"y"), bx=F(b,"x"), by=F(b,"y");
            if (ax===bx && ay===by) continue; // exact turn-in-place is allowed
            const found = actor.walks.some(w =>
                T(w,"fromConstraints")===T(a,"uniqueID") &&
                T(w,"toConstraints")===T(b,"uniqueID")
            );
            if (!found) {
                problems.push(`Actor ${actor.name}: ${T(a,"uniqueID")} → ${T(b,"uniqueID")} mení XY, ale HCW nemá jednoznačný WalkArrow.`);
            }
        }
    }

    // Track membership must be explicit from from/to or snapPath.
    const trackIDs = new Set(data.tracks.map(t=>T(t,"uniqueID")));
    for (const c of data.cameras) {
        const sp=T(c,"snapPath","");
        if (sp && !trackIDs.has(sp)) {
            problems.push(`Camera ${T(c,"uniqueID")}: snapPath=${sp}, ale taký Track v HCW neexistuje.`);
        }
    }

    // Embedded background, if referenced, must exist in Pictures.
    if (data.background) {
        const pid=T(data.background,"pictureUniqueID","");
        if (pid && !data.pictures.has(pid)) {
            problems.push(`Background odkazuje na Picture ${pid}, ale Picture/base64Data v HCW chýba.`);
        }
    }

    if (problems.length) {
        throw new Error(
            "STRICT HCW STOP — nič sa nebude domýšľať:\n" +
            problems.map((p,i)=>`${i+1}. ${p}`).join("\n")
        );
    }
}

function exactTrackPoints(track, members) {
    const P=directChild(track,"Points");
    let pts=P ? directChildren(P,"Point").map(p=>({x:F(p,"x"),y:F(p,"y")})) : [];
    if (pts.length >= 2) return pts;

    // This fallback is not an estimate: Track explicitly identifies its endpoints.
    const a=members.find(c=>T(c,"uniqueID")===T(track,"fromConstraints"));
    const b=members.find(c=>T(c,"uniqueID")===T(track,"toConstraints"));
    if (a && b) return [{x:F(a,"x"),y:F(a,"y")},{x:F(b,"x"),y:F(b,"y")}];

    throw new Error(`STRICT HCW STOP — Track ${T(track,"uniqueID")} nemá jednoznačnú geometriu.`);
}

function cameraTrackPercent(camera, track) {
    const id=T(camera,"uniqueID");

    // SOURCE 1: HCW Track explicitly defines its physical endpoints.
    if (id===T(track,"fromConstraints")) return 0;
    if (id===T(track,"toConstraints")) return 1;

    // SOURCE 2: existing verified universal HCW parser carries snapPercent
    // for intermediate Dolly camera states. Do not substitute
    // snapAbsolutePercent: in Pokus 23 HCW it is stored as 0 while the
    // actual intermediate Dolly position is explicitly snapPercent=0.828017...
    const raw=T(camera,"snapPercent","");
    if (raw!=="") {
        const v=Number(raw);
        if (Number.isFinite(v)) return v;
    }

    throw new Error(`STRICT HCW STOP — Camera ${id} je na Tracku, ale HCW neurčuje snapPercent.`);
}

function pointOnExactTrack(trackPoints, percent) {
    return pointOnPolyline(trackPoints, percent, 0, 0);
}

function cleanCaptionForCanvas(caption) {
    return cleanText(T(caption,"userText",""));
}

async function makePlayerModel(data, actors, cameraData) {
    strictHCWAudit(data, actors);
    const sequences = [...data.sequences].sort((a,b)=>a-b);
    const hcwBackground = await loadHCWBackground(data);
    sdPrepareProps(data);
    if (sequences.length === 0) throw new Error("HCW neobsahuje žiadne situácie/sequence.");

    const stateById = new Map(data.sceneStates.map(s => [T(s,"uniqueID"), s]));
    const actorTracks = actors.map(actor => ({
        name: actor.name,
        situations: sequences.map(seq => actorSituationState(actor, seq)),
        actor
    }));

    const trackById = new Map(data.tracks.map(t => [T(t,"uniqueID"), t]));
    const dollyCameraIDs = new Set();
    for (const tr of data.tracks) {
        const tid = T(tr,"uniqueID");
        const from = T(tr,"fromConstraints"), to = T(tr,"toConstraints");
        if (from) dollyCameraIDs.add(from);
        if (to) dollyCameraIDs.add(to);
        for (const cam of data.cameras) if (T(cam,"snapPath") === tid) dollyCameraIDs.add(T(cam,"uniqueID"));
    }

    const dollyTracks = data.tracks.map((track, index) => {
        const tid = T(track,"uniqueID");
        const members = data.cameras.filter(c =>
            T(c,"uniqueID") === T(track,"fromConstraints") ||
            T(c,"uniqueID") === T(track,"toConstraints") ||
            T(c,"snapPath") === tid
        );
        const trackPoints = exactTrackPoints(track, members);

        const cameraSetIndices = [...new Set(
            members.map(c => T(c,"colorIndex","")).filter(v => v !== "")
        )];
        if (cameraSetIndices.length !== 1) {
            throw new Error(
                `STRICT HCW STOP — Track ${tid}: kamerový set nie je jednoznačný priamo z HCW.`
            );
        }

        return {
            // Track membership = HCW fromConstraints/toConstraints/snapPath only.
            track,
            members,
            trackPoints,
            colorIndex: cameraSetIndices[0],
            situations: sequences.map(seq => {
                const active = members.map(c=>cameraSituationState(c,seq)).filter(Boolean);
                if (active.length > 1) throw new Error(`Track ${tid}: v situácii ${seq} je aktívnych viac kamerových stavov.`);
                if (!active[0]) return null;
                return {
                    ...active[0],
                    trackPercent: cameraTrackPercent(active[0].camera, track)
                };
            })
        };
    });

    // STRICT DOLLY SEQUENCE AUDIT
    // Order source = HCW sequence only. stopMarks is a label, never a sorter.
    // Each move is between two consecutive active Dolly states in that HCW order.
    for (const d of dollyTracks) {
        const ordered = d.situations
            .map((state, i) => state ? ({state, sequence:sequences[i]}) : null)
            .filter(Boolean);

        for (let i=0; i<ordered.length; i++) {
            const cur = ordered[i];
            if (!Number.isFinite(cur.state.trackPercent)) {
                throw new Error(
                    `STRICT HCW STOP — Dolly state ${cur.state.id} v sequence ${cur.sequence} nemá jednoznačnú pozíciu na Tracku.`
                );
            }
            if (i>0 && cur.sequence <= ordered[i-1].sequence) {
                throw new Error(
                    `STRICT HCW STOP — poradie Dolly stavov nie je jednoznačné podľa HCW sequence.`
                );
            }
        }

        d.orderedHCWStates = ordered;
    }

    const staticTracks = data.cameras
        .filter(c => !dollyCameraIDs.has(T(c,"uniqueID")))
        .map((camera,index) => ({
            camera,
            situations: sequences.map(seq => cameraSituationState(camera,seq))
        }));

    const worldPoints = [];
    worldPoints.push(...backgroundCorners(hcwBackground));
    for (const a of actorTracks) for (const s of a.situations) if (s) worldPoints.push({x:s.x,y:s.y});
    for (const a of actors) for (const w of a.walks) worldPoints.push(...walkPoints(w,stateById));
    for (const prop of data.props) worldPoints.push({x:F(prop,"x"),y:F(prop,"y")});
    for (const c of data.cameras) worldPoints.push({x:F(c,"x"),y:F(c,"y")});
    for (const tr of data.tracks) {
        const P=directChild(tr,"Points");
        if(P) for(const pt of directChildren(P,"Point")) worldPoints.push({x:F(pt,"x"),y:F(pt,"y")});
    }
    if (worldPoints.length===0) worldPoints.push({x:0,y:0},{x:1,y:1});
    let minX=Math.min(...worldPoints.map(p=>p.x)), maxX=Math.max(...worldPoints.map(p=>p.x));
    let minY=Math.min(...worldPoints.map(p=>p.y)), maxY=Math.max(...worldPoints.map(p=>p.y));
    if(maxX===minX){maxX+=1;minX-=1;} if(maxY===minY){maxY+=1;minY-=1;}

    const transitions = Math.max(0,sequences.length-1);
    const totalSeconds = HOLD_SECONDS + transitions*(MOVE_SECONDS+HOLD_SECONDS);
    return {data,actors,cameraData,sequences,stateById,actorTracks,dollyTracks,staticTracks,hcwBackground,bounds:{minX,maxX,minY,maxY},totalSeconds};
}

function phaseAtTime(model, seconds) {
    if (model.sequences.length === 1) return {index:0,nextIndex:0,moving:false,p:0,sequence:model.sequences[0]};
    if (seconds < HOLD_SECONDS) return {index:0,nextIndex:0,moving:false,p:0,sequence:model.sequences[0]};
    let t = seconds - HOLD_SECONDS;
    for (let i=0;i<model.sequences.length-1;i++) {
        if (t < MOVE_SECONDS) return {index:i,nextIndex:i+1,moving:true,p:t/MOVE_SECONDS,sequence:model.sequences[i]};
        t -= MOVE_SECONDS;
        if (t < HOLD_SECONDS) return {index:i+1,nextIndex:i+1,moving:false,p:0,sequence:model.sequences[i+1]};
        t -= HOLD_SECONDS;
    }
    const last=model.sequences.length-1;
    return {index:last,nextIndex:last,moving:false,p:0,sequence:model.sequences[last]};
}

function actorPoseAt(track, phase, model) {
    const a=track.situations[phase.index];
    const b=track.situations[phase.nextIndex];
    if(!a && !b) return null;
    if(!phase.moving) return b || a;
    if(!a) return b;
    if(!b) return a;
    if(a.id===b.id && a.x===b.x && a.y===b.y) {
        return {...a, angle:lerpAngle(a.angle,b.angle,phase.p)};
    }
    const points=findActorWalk(track.actor,a.id,b.id,model.stateById);
    if(points) return {...b,...pointOnCubicWalk(points,phase.p,b.angle,a.angle)};
    if(a.x===b.x && a.y===b.y) return {...b,x:a.x,y:a.y,angle:lerpAngle(a.angle,b.angle,phase.p)};
    // A changed actor state without its HCW WalkArrow is not invented.
    return phase.p < 1 ? a : b;
}

function cameraPoseAt(track, phase) {
    const a=track.situations[phase.index], b=track.situations[phase.nextIndex];
    if(!a && !b) return null;
    if(!phase.moving) return b || a;

    // Exact same HCW Camera state on both sides of the transition:
    // position, trackPercent and angle remain exactly unchanged.
    if(a && b && a.id===b.id) return a;

    // No source state / no target state means HCW gives no camera movement path.
    // Do not invent one.
    if(!a) return null;
    if(!b) return a;

    // STRICT UNIVERSAL DOLLY RULE:
    // a = active Dolly state at current HCW sequence
    // b = active Dolly state at the immediately following HCW sequence
    // Movement is ONLY a -> b, directly along their exact HCW Track interval.
    // stopMarks never determines order and no other Dolly state may be inserted.
    // Start/end are exact HCW camera states; no wrap-around and no detour.
    if (track.track && track.trackPoints) {
        const u=Math.max(0,Math.min(1,phase.p));
        const p=a.trackPercent+(b.trackPercent-a.trackPercent)*u;
        const q=pointOnExactTrack(track.trackPoints,p);
        return {
            ...a,
            x:q.x,
            y:q.y,
            angle:lerpAngle(a.angle,b.angle,u),
            trackPercent:p
        };
    }

    // Standalone camera: HCW does not give it a movement path.
    // Same XY may rotate in place. Different XY is not invented.
    if (a.x===b.x && a.y===b.y) {
        return {...b,x:a.x,y:a.y,angle:lerpAngle(a.angle,b.angle,phase.p)};
    }

    throw new Error(
        `STRICT HCW STOP — samostatná Camera ${a.id} mení XY bez Tracku. Pohybovú trasu HCW jednoznačne neurčuje.`
    );
}

/*
HCW -> BACKGROUND PIXEL LOCK
Reused from the already proven SD Bridge:
localX = HCW_X / (2 * Background.objectScaleX)
localY = -HCW_Y / (2 * Background.objectScaleY)
*/
function backgroundPlacement(model, canvas) {
    const bg=model.hcwBackground;
    if (!bg) throw new Error("STRICT HCW STOP — HCW nemá Background Picture.");
    if (!(bg.scaleX>0) || !(bg.scaleY>0)) throw new Error("STRICT HCW STOP — Background objectScaleX/Y musí byť kladný.");
    // Only the embedded decoration uses its own HCW rotation.
    const c=Math.cos(bg.angle), s=Math.sin(bg.angle);
    const rotatedW=Math.abs(bg.width*c)+Math.abs(bg.height*s);
    const rotatedH=Math.abs(bg.width*s)+Math.abs(bg.height*c);
    const pad=20;
    const scale=Math.min((canvas.width-2*pad)/rotatedW,(canvas.height-2*pad)/rotatedH);
    return {scale,cx:canvas.width/2,cy:canvas.height/2,
        width:bg.width*scale,height:bg.height*scale};
}

function hcwToBackgroundPixel(model, x, y) {
    const bg=model.hcwBackground;
    if (!bg) throw new Error("STRICT HCW STOP — HCW nemá Background Picture.");
    // Original v1.4 conversion, unchanged: no Background.angle in actor/camera XY.
    const localX=Number(x)/(2.0*bg.scaleX);
    const localY=-Number(y)/(2.0*bg.scaleY);
    return {x:bg.width/2+localX,y:bg.height/2-localY};
}

function worldToCanvas(model, canvas, x, y) {
    const p=hcwToBackgroundPixel(model,x,y);
    const b=backgroundPlacement(model,canvas);
    // Original v1.4 orientation. Fit is shared, but no decoration rotation.
    return {x:b.cx+(p.x-model.hcwBackground.width/2)*b.scale,
            y:b.cy+(p.y-model.hcwBackground.height/2)*b.scale,scale:b.scale};
}

function drawActorArrow(ctx,x,y,angle,length) {
    // TEST 04 LOCK: the HCW RotatorCharacter angle is drawn directly
    // as the radial line of the Shot Designer actor circle.
    const dx=Math.cos(angle)*length;
    const dy=Math.sin(angle)*length;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x+dx,y+dy);
    ctx.stroke();
}

function verifiedCameraSetColor(colorIndex) {
    /*
    STRICT PROVENANCE:
    colorIndex 3 -> TEST04 verified camera set (purple/magenta).
    colorIndex 2 -> user verified directly in Shot Designer for Pokus 23 as blue.
    No other mapping is invented. Unknown index = STOP.
    */
    if (String(colorIndex) === "3") return "#ff4fc3";
    if (String(colorIndex) === "2") return "blue";
    throw new Error(
        `STRICT HCW STOP — Camera colorIndex=${colorIndex}: farba tohto kamerového setu ešte nie je overená.`
    );
}

function drawCameraSymbol(ctx,x,y,angle,label,isDolly,colorIndex) {
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(angle);

    // TEST 04 LOCK: magenta filled film-camera graphic.
    const cameraColor=verifiedCameraSetColor(colorIndex);
    ctx.fillStyle=cameraColor;
    ctx.strokeStyle="#111";
    ctx.lineWidth=1.5;

    // camera body
    ctx.beginPath();
    ctx.rect(-9,-7,18,14);
    ctx.fill();
    ctx.stroke();

    // lens / hood
    ctx.beginPath();
    ctx.moveTo(9,-6);
    ctx.lineTo(18,-11);
    ctx.lineTo(18,11);
    ctx.lineTo(9,6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // two reels
    ctx.beginPath();
    ctx.arc(-5,-12,4,0,Math.PI*2);
    ctx.arc(5,-12,4,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.restore();

    if(label){
        ctx.fillStyle=cameraColor;
        ctx.font="bold 12px Arial";
        ctx.fillText(label,x+15,y-12);
    }
}

function drawActorRoster(ctx, canvas, model) {
    // SOURCE:
    // name = existing verified HCW actor reconstruction
    // color = HCW Character colorName in actor signature
    // right-side placement = explicit user instruction
    const actors=model.actorTracks||[];
    if(!actors.length) return;

    ctx.save();
    ctx.font="bold 15px Arial";

    let maxText=0;
    for(const tr of actors) maxText=Math.max(maxText,ctx.measureText(tr.name).width);

    const rowH=28, boxW=Math.max(150,maxText+58), boxH=18+actors.length*rowH+14;
    const x=canvas.width-boxW-18, y=18;

    ctx.fillStyle="rgba(255,255,255,.88)";
    ctx.strokeStyle="#111";
    ctx.lineWidth=1;
    ctx.fillRect(x,y,boxW,boxH);
    ctx.strokeRect(x,y,boxW,boxH);

    actors.forEach((tr,i)=>{
        const colorName=String(tr.actor.signature||"").split("|")[0];
        if(!colorName) throw new Error(`STRICT HCW STOP — postava ${tr.name} nemá jednoznačný HCW colorName.`);

        const cy=y+24+i*rowH;
        ctx.fillStyle=colorName;
        ctx.strokeStyle="#111";
        ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.arc(x+20,cy,9,0,Math.PI*2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle="#111";
        ctx.font="bold 15px Arial";
        ctx.fillText(tr.name,x+38,cy+5);
    });
    ctx.restore();
}

const sdPropImages = Object.create(null);
function sdPrepareProps(data) {
  const missing=[];
  for(const prop of data.props){
    const key=T(prop,'objectKey','').toUpperCase();
    if(!SD_ORIGINAL_SVG[key]){missing.push(key||'(empty)');continue;}
    if(!sdPropImages[key]){
      const img=new Image();img.src=SD_ORIGINAL_SVG[key];sdPropImages[key]=img;
      img.onload=()=>{if(playerModel&&!isPlaying)drawSceneAt(currentAnimationSeconds);};
    }
  }
  if(missing.length)throw new Error('STRICT HCW STOP — chýba originálny symbol: '+[...new Set(missing)].join(', '));
}
// ADD-ONLY: SWF GenericObject.PreRender applies HCW RGB multipliers and offsets.
// Per-prop color transforms are cached; original SVG files and scene logic remain unchanged.
const sdColoredPropCache = new Map();
function sdPropColorImage(img, prop, key) {
  const channels=['red','green','blue'];
  const mult=channels.map(c=>F(prop,c+'Multiplier',1));
  const offs=channels.map(c=>F(prop,c+'Offset',0));
  const cacheKey=key+'|'+mult.join(',')+'|'+offs.join(',');
  if(sdColoredPropCache.has(cacheKey))return sdColoredPropCache.get(cacheKey);
  if(mult.every(v=>v===1)&&offs.every(v=>v===0))return img;
  const surface=document.createElement('canvas');
  surface.width=img.naturalWidth;surface.height=img.naturalHeight;
  const c=surface.getContext('2d',{willReadFrequently:true});
  c.drawImage(img,0,0);
  const pixels=c.getImageData(0,0,surface.width,surface.height);
  for(let i=0;i<pixels.data.length;i+=4){
    for(let ch=0;ch<3;ch++)pixels.data[i+ch]=Math.max(0,Math.min(255,Math.round(pixels.data[i+ch]*mult[ch]+offs[ch])));
  }
  c.putImageData(pixels,0,0);
  sdColoredPropCache.set(cacheKey,surface);
  return surface;
}
function sdDrawOriginalProp(ctx,canvas,model,prop){
  const key=T(prop,'objectKey','').toUpperCase();
  const img=sdPropImages[key];
  if(!img||!img.complete||!img.naturalWidth)return;
  const p=worldToCanvas(model,canvas,F(prop,'x'),F(prop,'y'));
  const bg=model.hcwBackground;
  // Exact same HCW->background conversion as the working v1.4 player.
  // SWF native SVG dimensions are no longer browser-default 300x150.
  const sx=F(prop,'objectScaleX',1),sy=F(prop,'objectScaleY',1);
  const pxPerUnitX=p.scale/(2*bg.scaleX);
  const pxPerUnitY=p.scale/(2*bg.scaleY);
  const angle=angleOf(prop,'RotatorObject');
  const mirror=T(prop,'mirror','false').toLowerCase()==='true';
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(angle);
  ctx.scale((mirror?-1:1)*sx*pxPerUnitX,sy*pxPerUnitY);
  ctx.drawImage(sdPropColorImage(img,prop,key),-img.naturalWidth/2,-img.naturalHeight/2,img.naturalWidth,img.naturalHeight);
  ctx.restore();
}
function sdCaptionLines(cap) {
  return T(cap,'userText','').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').split('\n');
}
function sdDrawCaptions(ctx,canvas,model) {
  const byID=new Map();
  for(const el of [...model.data.props,...model.data.sceneStates,...model.data.templates,...model.data.cameras,...model.data.lights]){
    const id=T(el,'uniqueID','');if(id)byID.set(id,el);
  }
  for(const cap of model.data.captions){
    const lines=sdCaptionLines(cap);if(!lines.some(t=>t.trim()))continue;
    const q=worldToCanvas(model,canvas,F(cap,'x'),F(cap,'y'));
    const id=T(cap,'attachObjectID','');
    if(id){
      const attached=byID.get(id);
      if(!attached) throw new Error('STRICT HCW STOP — Caption attachObjectID not found: '+id);
      const a=worldToCanvas(model,canvas,F(attached,'x'),F(attached,'y'));
      ctx.save();ctx.strokeStyle='#999';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(a.x,a.y);ctx.stroke();ctx.restore();
    }
    const size=(T(cap,'fontSize','0')==='1'?15:12)*backgroundPlacement(model,canvas).scale;
    const bold=T(cap,'fontBold','false').toLowerCase()==='true';
    ctx.save();ctx.font=(bold?'bold ':'')+size+'px Arial';
    const lineHeight=size*1.15;
    const width=Math.max(...lines.map(t=>ctx.measureText(t).width));
    if(T(cap,'backgroundColor','0')==='1'){
      ctx.fillStyle='#ffe97b';const pad=2*backgroundPlacement(model,canvas).scale;ctx.fillRect(q.x-pad,q.y-size-pad,width+2*pad,lineHeight*lines.length+2*pad);
    } else if(T(cap,'backgroundColor','0')!=='0'){
      throw new Error('STRICT HCW STOP — Caption backgroundColor unknown: '+T(cap,'backgroundColor'));
    }
    ctx.fillStyle='#111';lines.forEach((line,i)=>ctx.fillText(line,q.x,q.y+i*lineHeight));ctx.restore();
  }
}

function drawSceneAt(seconds) {
    const canvas=document.getElementById("sceneCanvas"), ctx=canvas.getContext("2d");
    ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
    if(!playerModel) return;
    const phase=phaseAtTime(playerModel,Math.max(0,Math.min(seconds,playerModel.totalSeconds)));

    // Exact embedded HCW Background Picture = reference pixel frame.
    if (playerModel.hcwBackground) {
        const bg=playerModel.hcwBackground;
        const b=backgroundPlacement(playerModel,canvas);
        ctx.save();ctx.translate(b.cx,b.cy);ctx.rotate(bg.angle);ctx.drawImage(bg.image,-b.width/2,-b.height/2,b.width,b.height);ctx.restore();
    }

    // Dolly Track: exact HCW geometry only.
    for(const d of playerModel.dollyTracks){
        const pts=d.trackPoints;
        ctx.strokeStyle=verifiedCameraSetColor(d.colorIndex);ctx.lineWidth=2;ctx.beginPath();
        pts.forEach((p,i)=>{const q=worldToCanvas(playerModel,canvas,p.x,p.y);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});
        ctx.stroke();
    }

    // Additive original SWF graphics and all HCW captions, including leader lines.
    for(const prop of playerModel.data.props) sdDrawOriginalProp(ctx,canvas,playerModel,prop);
    sdDrawCaptions(ctx,canvas,playerModel);

    for(const tr of playerModel.actorTracks){
        const pose=actorPoseAt(tr,phase,playerModel); if(!pose) continue;
        const q=worldToCanvas(playerModel,canvas,pose.x,pose.y);
        ctx.fillStyle=pose.colorName||"#888"; ctx.strokeStyle="#111";ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(q.x,q.y,11,0,Math.PI*2);ctx.fill();ctx.stroke();
        drawActorArrow(ctx,q.x,q.y,pose.angle,27);
        ctx.fillStyle="#111";ctx.font="13px Arial";ctx.fillText(tr.name,q.x+15,q.y+18);
    }

    for(const d of playerModel.dollyTracks){
        const pose=cameraPoseAt(d,phase);if(!pose)continue;const q=worldToCanvas(playerModel,canvas,pose.x,pose.y);
        drawCameraSymbol(ctx,q.x,q.y,pose.angle,pose.stopMarks?String(pose.stopMarks):"",true,pose.colorIndex);
    }
    for(const c of playerModel.staticTracks){
        const pose=cameraPoseAt(c,phase);if(!pose)continue;const q=worldToCanvas(playerModel,canvas,pose.x,pose.y);
        drawCameraSymbol(ctx,q.x,q.y,pose.angle,"",false,pose.colorIndex);
    }

    // HCW actor roster is drawn into the same canvas, therefore it is also in exported video.
    drawActorRoster(ctx,canvas,playerModel);

    ctx.fillStyle="#111";ctx.font="16px Arial";
    const phaseText=phase.moving?`POHYB ${Math.round(phase.p*100)} %`:`HOLD`;
    ctx.fillText(`Situácia ${phase.sequence}   ${phaseText}   ${seconds.toFixed(2)} s / ${playerModel.totalSeconds.toFixed(2)} s`,18,28);
    document.getElementById("playerInfo").textContent=`Situácia ${phase.sequence} | ${phaseText} | ${seconds.toFixed(2)} / ${playerModel.totalSeconds.toFixed(2)} s`;
}

function stopPlayback(reset=true) {
    if(animationRAF) cancelAnimationFrame(animationRAF); animationRAF=null; isPlaying=false;
    if(reset){currentAnimationSeconds=0;drawSceneAt(0);}
    document.getElementById("playButton").textContent="PLAY";
}

function startPlayback(fromSeconds=0) {
    if(!playerModel)return; stopPlayback(false); isPlaying=true; currentAnimationSeconds=fromSeconds;
    animationStartMS=performance.now()-fromSeconds*1000; document.getElementById("playButton").textContent="PAUZA";
    const tick=now=>{
        if(!isPlaying)return;
        currentAnimationSeconds=(now-animationStartMS)/1000;
        if(currentAnimationSeconds>=playerModel.totalSeconds){currentAnimationSeconds=playerModel.totalSeconds;drawSceneAt(currentAnimationSeconds);isPlaying=false;document.getElementById("playButton").textContent="PLAY";return;}
        drawSceneAt(currentAnimationSeconds); animationRAF=requestAnimationFrame(tick);
    };
    animationRAF=requestAnimationFrame(tick);
}

function preferredMP4Mime() {
    const candidates=["video/mp4;codecs=avc1.42E01E","video/mp4;codecs=avc1","video/mp4"];
    if(typeof MediaRecorder==="undefined") return null;
    return candidates.find(x=>MediaRecorder.isTypeSupported(x))||null;
}

async function exportMP4() {
    if(!playerModel)return;
    const mime=preferredMP4Mime();
    if(!mime){
        status.className="error";
        status.textContent="Tento prehliadač nepodporuje priamy MP4 záznam Canvasu cez MediaRecorder. HCW animácia zostáva funkčná; MP4 export vyžaduje prehliadač s video/mp4 MediaRecorder podporou.";
        return;
    }
    stopPlayback(false);
    const canvas=document.getElementById("sceneCanvas"), stream=canvas.captureStream(EXPORT_FPS);
    const chunks=[]; const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000});
    recordingState=recorder;
    recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    recorder.onerror=e=>{status.className="error";status.textContent="CHYBA MP4: "+(e.error?.message||e.message||"MediaRecorder")};
    recorder.onstop=()=>{
        const blob=new Blob(chunks,{type:mime}); const url=URL.createObjectURL(blob); const a=document.createElement("a");
        a.href=url; a.download="HCW_Animator.mp4"; document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
        status.className="ok";status.textContent="MP4 video exportované."; recordingState=null;
    };
    status.className="";status.textContent="Exportujem MP4 video v reálnom čase…"; recorder.start(1000);
    animationStartMS=performance.now(); isPlaying=true; currentAnimationSeconds=0;
    const tick=now=>{
        currentAnimationSeconds=(now-animationStartMS)/1000;
        if(currentAnimationSeconds>=playerModel.totalSeconds){currentAnimationSeconds=playerModel.totalSeconds;drawSceneAt(currentAnimationSeconds);isPlaying=false;setTimeout(()=>recorder.stop(),150);return;}
        drawSceneAt(currentAnimationSeconds);animationRAF=requestAnimationFrame(tick);
    };
    animationRAF=requestAnimationFrame(tick);
}

async function installPlayerModel(data,actors,cameraData) {
    playerModel=await makePlayerModel(data,actors,cameraData); currentAnimationSeconds=0;
    document.getElementById("playButton").disabled=false;
    document.getElementById("stopButton").disabled=false;
    document.getElementById("exportButton").disabled=false;
    drawSceneAt(0);
}

/*
============================================================
MAIN
============================================================
*/


const fileInput =
    document.getElementById(
        "hcwFile"
    );


const openButton =
    document.getElementById(
        "openButton"
    );


const status =
    document.getElementById(
        "status"
    );


const output =
    document.getElementById(
        "output"
    );

const playButton = document.getElementById("playButton");
const stopButton = document.getElementById("stopButton");
const exportButton = document.getElementById("exportButton");

playButton.addEventListener("click", () => {
    if (!playerModel) return;
    if (isPlaying) {
        if (animationRAF) cancelAnimationFrame(animationRAF);
        animationRAF = null;
        isPlaying = false;
        playButton.textContent = "PLAY";
    } else {
        if (currentAnimationSeconds >= playerModel.totalSeconds) currentAnimationSeconds = 0;
        startPlayback(currentAnimationSeconds);
    }
});

stopButton.addEventListener("click", () => stopPlayback(true));
exportButton.addEventListener("click", exportMP4);


openButton.addEventListener(
    "click",
    async () => {

        const file =
            fileInput.files[0];


        if (!file) {

            status.className =
                "error";

            status.textContent =
                "Najprv vyber HCW súbor.";

            return;
        }


        try {

            status.className = "";

            status.textContent =
                "Čítam HCW...";


            output.textContent = "";


            const text =
                await file.text();


            const parser =
                new DOMParser();


            const xml =
                parser.parseFromString(
                    text,
                    "application/xml"
                );


            const parserError =
                xml.getElementsByTagName(
                    "parsererror"
                );


            if (
                parserError.length > 0
            ) {

                throw new Error(
                    "HCW XML sa nepodarilo načítať."
                );
            }


            /*
            ================================================
            EXISTING PROVEN PIPELINE
            ================================================
            */


            const data =
                parseHCW(xml);


            const actors =
                buildActorComponents(
                    data
                );


            const actorTimeline =
                buildActorTimeline(
                    data,
                    actors
                );


            const cameraData =
                buildCameraData(
                    data
                );


            /* Existing parser data -> universal 2D animation model. */
            await installPlayerModel(
                data,
                actors,
                cameraData
            );


            /*
            ================================================
            REPORT
            ================================================
            */


            output.textContent =
                makeReport(
                    file.name,
                    data,
                    actors,
                    actorTimeline,
                    cameraData
                );


            status.className =
                "ok";


            status.textContent =
                playerModel && playerModel.hcwBackground
                    ? "HCW úspešne načítané — STRICT technický prepis + dekorácia + animácia pripravené."
                    : "HCW úspešne načítané — STRICT technický prepis + animácia pripravené; HCW neobsahuje vložený Background Picture.";

        }

        catch (error) {

            console.error(error);


            status.className =
                "error";


            status.textContent =
                "CHYBA: " +
                error.message;
        }
    }
);

</script>
