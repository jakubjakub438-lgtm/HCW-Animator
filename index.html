<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCW Animator</title>
</head>
<body>
    <h1>HCW Animator</h1>
    <p>Webová verzia HCW Animatora.</p>

    <input type="file" id="hcwFile" accept=".hcw">
    <button id="openButton">OTVORIŤ HCW</button>

    <p id="status">HCW súbor zatiaľ nie je otvorený.</p>
    <script>
const hcwFile = document.getElementById("hcwFile");
const openButton = document.getElementById("openButton");
const status = document.getElementById("status");

openButton.addEventListener("click", async () => {
    const file = hcwFile.files[0];

    if (!file) {
        status.textContent = "Najprv vyber HCW súbor.";
        return;
    }

    try {
        const content = await file.text();

        if (content.length === 0) {
            status.textContent = "CHYBA: HCW súbor je prázdny.";
            return;
        }

        const parser = new DOMParser();
const xml = parser.parseFromString(content, "text/xml");

const parseError = xml.querySelector("parsererror");

if (parseError) {
    status.textContent = "CHYBA: HCW súbor sa nepodarilo rozpoznať ako XML.";
    return;
}

const characterCount = xml.getElementsByTagName("Character").length;
const cameraCount = xml.getElementsByTagName("Camera").length;
const walkArrowCount = xml.getElementsByTagName("WalkArrow").length;
const trackCount = xml.getElementsByTagName("Track").length;
const timeNumberCount = xml.getElementsByTagName("TimeNumber").length;

const characters = xml.getElementsByTagName("Character");

let characterData = "";

const getHCWValue = (element, tagName) => {
    const node = element.getElementsByTagName(tagName)[0];
    return node ? node.textContent.trim() : "";
};

for (let i = 0; i < characters.length; i++) {

    const character = characters[i];

    const characterID = getHCWValue(character, "uniqueID");
    const characterX = getHCWValue(character, "x");
    const characterY = getHCWValue(character, "y");
    const characterColor = getHCWValue(character, "color");
    const characterColorName = getHCWValue(character, "colorName");

    characterData +=
        "<br><br><strong>Character " + (i + 1) + "</strong><br>" +
        "ID: " + characterID + "<br>" +
        "X: " + characterX + "<br>" +
        "Y: " + characterY + "<br>" +
        "Color: " + characterColor + "<br>" +
        "ColorName: " + characterColorName + "<br>";

    const rotators = character.getElementsByTagName("RotatorCharacter");

    characterData +=
        "<strong>RotatorCharacter: " + rotators.length + "</strong><br>";

    for (let r = 0; r < rotators.length; r++) {

        const rotator = rotators[r];

        characterData +=
            "Rotator " + (r + 1) + "<br>" +
            "ID: " + getHCWValue(rotator, "uniqueID") + "<br>" +
            "Angle: " + getHCWValue(rotator, "angle") + "<br>";
    }
}

status.innerHTML =
    "HCW súbor bol úspešne prečítaný: " + file.name +
    "<br><br>" +
    "<strong>HCW ŠTRUKTÚRA:</strong><br>" +
    "Character: " + characterCount + "<br>" +
    "Camera: " + cameraCount + "<br>" +
    "WalkArrow: " + walkArrowCount + "<br>" +
    "Track: " + trackCount + "<br>" +
    "TimeNumber: " + timeNumberCount +
    "<br><br><strong>CHARACTER DATA:</strong>" +
    characterData;
    } catch (error) {
        status.textContent = "CHYBA: HCW súbor sa nepodarilo prečítať.";
    }
});
</script>
</body>
</html>
